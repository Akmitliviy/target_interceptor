services:
  simulation:
    image: simulation
    container_name: sim-container
    network_mode: host
    build:
      context: ./simulation
      dockerfile: Dockerfile
      target: sim
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ./simulation/gazebo/worlds:/simulation/gazebo/worlds
      - ./simulation/gazebo/models:/simulation/gazebo/models
    environment:
      - DISPLAY=${DISPLAY:-}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/10_nvidia.json
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "gz topic -l"]
      start_period: 10s
      start_interval: 10s
      interval: 5s
      retries: 5
      timeout: 3s

  sitl:
    image: sitl
    container_name: sitl-container
    network_mode: host
    build:
      context: ./sitl
      dockerfile: Dockerfile
      target: sitl
      args:
        - PX4_REVISION_TAG=v1.18.0
    environment:
      - PX4_GZ_STANDALONE=1
      - PX4_GZ_WORLD=aruco
      - PX4_SYS_AUTOSTART=4001
      - PX4_SIM_MODEL=gz_x500
    volumes:
      - ./sitl/logs:/sitl/px4/rootfs/log
    depends_on:
      simulation:
        condition: service_healthy
    stdin_open: true
    tty: true
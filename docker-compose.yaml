services:
  simulation:
    image: simulation
    container_name: sim-container
    network_mode: host
    build:
      context: ./simulation
      dockerfile: Dockerfile
      target: sim
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ./simulation/gazebo/worlds:/simulation/gazebo/worlds
      - ./simulation/gazebo/models:/simulation/gazebo/models
    environment:
      - DISPLAY=${DISPLAY:-}
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  sitl:
    image: sitl
    container_name: sitl-container
    network_mode: host
    build:
      context: ./sitl
      dockerfile: Dockerfile
      target: sitl
      args:
        - PX4_REVISION_TAG=v1.18.0
    environment:
      - PX4_GZ_STANDALONE=1
    depends_on:
      - simulation